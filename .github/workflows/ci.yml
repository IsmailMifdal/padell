name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests unitaires
        run: npm test
      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Figé : Flutter 3.47+ déprécie package:flutter/material.dart (analyse en échec)
          # et exige Gradle 9.3.1. À monter avec une migration dédiée.
          flutter-version: 3.44.9
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build

  # Build Android : angle mort découvert le 26/07/2026 — un commit dont la
  # compilation APK était cassée (flutter_local_notifications exigeait le core
  # library desugaring) est passé au vert, parce que `flutter analyze` et
  # `flutter test` ne touchent jamais à Gradle. Ce job ferme ce trou.
  #
  # Il publie aussi l'APK en artefact : plus besoin de le compiler en local,
  # ce que la machine de dev peine à faire (crashs JVM par manque de mémoire).
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Figé : Flutter 3.47+ déprécie package:flutter/material.dart (analyse en échec)
          # et exige Gradle 9.3.1. À monter avec une migration dédiée.
          flutter-version: 3.44.9
          cache: true
      - run: flutter pub get
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: padel-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
